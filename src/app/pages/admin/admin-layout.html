<mat-sidenav-container class="container">
  <mat-sidenav
    #nav
    class="nav"
    [mode]="mobile() ? 'over' : 'side'"
    [opened]="!mobile()"
  >
    <div class="nav-brand">
      <img src="images/logo.png" alt="" width="48" height="50" />
      <div>
        <span>Cantinero entrerriano</span>
        <small>Panel de gestión</small>
      </div>
    </div>
    <mat-nav-list>
      <a mat-list-item routerLink="productos" routerLinkActive #rlaP="routerLinkActive" [activated]="rlaP.isActive" (click)="mobile() && nav.close()">
        <mat-icon matListItemIcon>inventory_2</mat-icon>
        <span matListItemTitle>Productos</span>
      </a>
      <a mat-list-item routerLink="ventas" routerLinkActive #rlaV="routerLinkActive" [activated]="rlaV.isActive" (click)="mobile() && nav.close()">
        <mat-icon matListItemIcon>receipt_long</mat-icon>
        <span matListItemTitle>Ventas y envíos</span>
        @if (paraDespachar() > 0) {
          <span matListItemMeta class="count">{{ paraDespachar() }}</span>
        }
      </a>
    </mat-nav-list>
    <span class="spacer"></span>
    <mat-nav-list>
      <a mat-list-item routerLink="/">
        <mat-icon matListItemIcon>storefront</mat-icon>
        <span matListItemTitle>Ver tienda</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="topbar">
      @if (mobile()) {
        <button mat-icon-button aria-label="Abrir menú" (click)="nav.toggle()">
          <mat-icon>menu</mat-icon>
        </button>
      }
      <span class="spacer"></span>
      <button mat-button [matMenuTriggerFor]="userMenu">
        <mat-icon>account_circle</mat-icon>
        {{ auth.usuario()?.nombre }}
        <small class="rol">{{ auth.usuario()?.rol }}</small>
      </button>
      <mat-menu #userMenu="matMenu" xPosition="before">
        <div class="menu-email" mat-menu-item disabled>{{ auth.usuario()?.email }}</div>
        <button mat-menu-item (click)="salir()">
          <mat-icon>logout</mat-icon>
          Cerrar sesión
        </button>
      </mat-menu>
    </mat-toolbar>

    <main class="content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
